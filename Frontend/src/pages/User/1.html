<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tạo Hóa Đơn Chuẩn Test OCR > 96%</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8fafc; padding: 20px; text-align: center; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 500px; margin: 0 auto; }
    canvas { border: 1px solid #cbd5e1; width: 100%; height: auto; display: block; margin: 15px 0; }
    button { background: #16a34a; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="color:#16a34a; margin:0;">HÓA ĐƠN CHUẨN ĐỘ TIN CẬY > 96%</h3>
    <p style="font-size: 13px; color: #64748b;">Độ phân giải siêu cao (1200x1800), chữ to không chân, khoảng cách ký tự chuẩn</p>
    <canvas id="canvasHighAcc" width="1200" height="1800"></canvas>
    <button onclick="downloadImage()">Tải hoa_don_chuan_96.png</button>
  </div>

  <script>
    const canvas = document.getElementById("canvasHighAcc");
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;

    // Nền trắng tinh không nhiễu
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#000000";
    ctx.textBaseline = "middle";

    // 1. Header (Font chữ lớn, rõ nét)
    ctx.textAlign = "center";
    ctx.font = "bold 52px Arial";
    ctx.fillText("CÔNG TY CỔ PHẦN PHÚC LONG", w / 2, 100);
    
    ctx.font = "36px Arial";
    ctx.fillText("Chi nhánh: Quận 1, TP Hồ Chí Minh", w / 2, 170);

    ctx.font = "bold 44px Arial";
    ctx.fillText("HÓA ĐƠN THANH TOÁN", w / 2, 250);

    // Đường kẻ phân cách
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80, 310); ctx.lineTo(w - 80, 310);
    ctx.stroke();

    // 2. Thông tin chứng từ
    ctx.textAlign = "left";
    ctx.font = "bold 36px 'Courier New', monospace";
    ctx.fillText("Số HĐ: INV-2026-8869", 100, 380);
    ctx.fillText("Ngày: 26/09/2026", 100, 450);
    ctx.fillText("Phương thức: Tiền mặt", 100, 520);
    ctx.fillText("Thu ngân: Nguyễn Văn A", 100, 590);

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(80, 650); ctx.lineTo(w - 80, 650);
    ctx.stroke();

    // 3. Tiêu đề bảng món
    ctx.font = "bold 36px Arial";
    ctx.fillText("Tên mặt hàng", 100, 710);
    ctx.fillText("SL", 720, 710);
    ctx.fillText("Thành tiền", 900, 710);

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(80, 750); ctx.lineTo(w - 80, 750);
    ctx.stroke();

    // 4. Danh sách món (Chữ to, khoảng cách dòng thoáng)
    const items = [
      ["Trà Sữa Phúc Long", "02", "110000"],
      ["Trà Đào Cam Sả", "01", "60000"],
      ["Bánh Mì Bơ Tỏi", "01", "35000"],
      ["Cà Phê Sữa Đá", "01", "45000"]
    ];

    let y = 820;
    ctx.font = "34px Arial";
    items.forEach(row => {
      ctx.fillText(row[0], 100, y);
      ctx.fillText(row[1], 730, y);
      ctx.fillText(row[2], 910, y);
      y += 90;
    });

    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80, y + 20); ctx.lineTo(w - 80, y + 20);
    ctx.stroke();

    // 5. Tổng kết thanh toán (Từ khóa rõ ràng cho Regex)
    y += 110;
    ctx.font = "bold 40px Arial";
    ctx.fillText("Tổng tiền hàng:", 100, y);
    ctx.fillText("250000", 910, y);

    y += 85;
    ctx.font = "36px Arial";
    ctx.fillText("Thuế VAT 8%:", 100, y);
    ctx.fillText("20000", 930, y);

    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80, y + 50); ctx.lineTo(w - 80, y + 50);
    ctx.stroke();

    y += 140;
    ctx.font = "bold 56px Arial";
    ctx.fillText("TỔNG CỘNG:", 100, y);
    ctx.fillText("270000 VNĐ", 780, y);

    // 6. Chân trang
    ctx.textAlign = "center";
    ctx.font = "italic 34px Arial";
    ctx.fillText("Cảm ơn Quý Khách và Hẹn Gặp Lại!", w / 2, y + 180);

    function downloadImage() {
      const link = document.createElement("a");
      link.download = "hoa_don_chuan_96.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }
  </script>
</body>
</html>
